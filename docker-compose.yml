version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: setu-postgres
    restart: always
    environment:
      POSTGRES_USER: setu_user
      POSTGRES_PASSWORD: setu_password_2026
      POSTGRES_DB: setu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu_user -d setu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: setu-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://setu_user:setu_password_2026@postgres:5432/setu_db?schema=public"
      JWT_SECRET: "setu_secret_jwt_key_2026_academic_prototype"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: setu-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
