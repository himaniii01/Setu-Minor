<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="setuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08234D" />
      <stop offset="50%" stop-color="#0F346C" />
      <stop offset="100%" stop-color="#061836" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Clean Circular Ring -->
  <circle cx="256" cy="256" r="256" fill="url(#setuBg)" />
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="10 6" opacity="0.6" />

  <!-- Central Ashoka Emblem Lions & Chakra representation -->
  <g transform="translate(136, 50) scale(0.95)">
    <!-- Crown Lions -->
    <path d="M120 70 C120 35, 135 15, 150 15 C165 15, 180 35, 180 70 C180 95, 175 115, 170 125 C190 120, 205 105, 215 90 C222 78, 225 60, 220 50 C232 68, 230 90, 220 110 C208 132, 188 145, 168 150 C173 165, 173 180, 168 195 L132 195 C127 180, 127 165, 132 150 C112 145, 92 132, 80 110 C70 90, 68 68, 80 50 C75 60, 78 78, 85 90 C95 105, 110 120, 130 125 C125 115, 120 95, 120 70 Z" fill="url(#goldGrad)" />
    
    <!-- Lion Chest Details -->
    <path d="M140 75 C140 60, 150 50, 150 50 C150 50, 160 60, 160 75 C160 95, 150 110, 150 110 C150 110, 140 95, 140 75 Z" fill="#08234D" opacity="0.3" />

    <!-- Pillar Base Capital -->
    <path d="M95 195 L205 195 L200 240 L100 240 Z" fill="url(#goldGrad)" />
    
    <!-- Abacus band -->
    <rect x="85" y="240" width="130" height="28" rx="6" fill="#D97706" stroke="#FBBF24" stroke-width="2" />
    
    <!-- Ashoka Chakra Wheel 24 Spokes -->
    <circle cx="150" cy="254" r="11" fill="#08234D" stroke="#FBBF24" stroke-width="2" />
    <circle cx="150" cy="254" r="3" fill="#FBBF24" />

    <!-- Base Bell Pedestal -->
    <path d="M75 268 L225 268 L205 315 L95 315 Z" fill="url(#goldGrad)" />
    
    <!-- Satyamev Jayate Motto -->
    <text x="150" y="352" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle">सत्यमेव जयते</text>
    
    <!-- SETU Gateway Wordmark -->
    <text x="150" y="388" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#FBBF24" letter-spacing="5" text-anchor="middle">SETU</text>
  </g>
</svg>
